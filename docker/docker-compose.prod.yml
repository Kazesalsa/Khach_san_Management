version: '3.8'

services:
  backend:
    image: tantai24/suongmai-backend:latest
    container_name: suongmai_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

  frontend:
    image: tantai24/suongmai-frontend:latest
    container_name: suongmai_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

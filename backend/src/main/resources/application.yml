spring:
  application:
    name: suongmai

  datasource:
    # URL kết nối tới PostgreSQL container đang mở tại localhost:5433
    url: jdbc:postgresql://localhost:5433/suongmai_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    # hibernate ddl-auto:
    # - "none": Không tự động tạo hay sửa bảng
    # - "update": Tự động cập nhật bảng theo các @Entity class mà không xóa dữ liệu cũ
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

payos:
  client-id: ${PAYOS_CLIENT_ID:51427319-9751-42d2-b369-28838940e205}
  api-key: ${PAYOS_API_KEY:d975a665-079b-47a1-a269-d779e1a546d3}
  checksum-key: ${PAYOS_CHECKSUM_KEY:eaa65f16a5dd2dd9b4e569223f28e07341055aa0a5796a3554b1ef2c0037a3bd}
  return-url: ${PAYOS_RETURN_URL:http://localhost:5173/payment/result}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/payment/result?cancel=true}
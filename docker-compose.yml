# version line removed as it's obsolete for Docker Compose v2
services:
  postgres:
    image: postgres:15-alpine
    container_name: suongmai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: suongmai_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount thư mục database vào initdb để Docker tự động chạy script khi khởi tạo DB lần đầu
      - ./database:/docker-entrypoint-initdb.d
    restart: unless-stopped

  # Tuỳ chọn: Thêm pgAdmin để xem Database trên Web
  pgadmin:
    image: dpage/pgadmin4
    container_name: suongmai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@suongmai.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5555:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
